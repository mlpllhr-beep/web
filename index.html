<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Notes — a blog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6f1;--ink:#17231c;--mute:#64b983;--line:#cfd9d0;--accent:#1f6f54;--card:#e8efe8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--ink:#e6efe8;--mute:#9db0a4;--line:#27382d;--accent:#5fc9a0;--card:#17251d}}
:root[data-theme="dark"]{--bg:#101a15;--ink:#e6efe8;--mute:#9db0a4;--line:#27382d;--accent:#5fc9a0;--card:#17251d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Public Sans",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px;gap:12px}
.brand{font:700 24px "Fraunces",Georgia,serif;text-decoration:none;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
nav{display:flex;gap:16px;align-items:center;font-size:15px}
nav button{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;padding:4px 0}
nav button:hover,nav button.on{color:var(--ink)}
.intro{padding:56px 0 24px}
.intro h1{font:700 clamp(36px,7vw,60px)/1.05 "Fraunces",Georgia,serif;margin:0 0 16px;letter-spacing:-.02em}
.intro p{color:var(--mute);max-width:52ch;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 8px}
.tag{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 14px;font:500 14px "Public Sans",sans-serif;cursor:pointer}
.tag.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.post{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:28px 0;color:inherit;cursor:pointer;font:inherit}
.post h2{font:700 27px/1.2 "Fraunces",Georgia,serif;margin:6px 0 8px}
.post:hover h2{color:var(--accent)}
.post p{margin:0;color:var(--mute)}
.meta{font-size:14px;color:var(--mute)}
article{padding:48px 0 32px}
article h1{font:700 clamp(32px,6vw,48px)/1.1 "Fraunces",Georgia,serif;margin:8px 0 12px;letter-spacing:-.015em}
article .body p{margin:0 0 1.25em;font-family:"Fraunces",Georgia,serif;font-size:19px;line-height:1.75}
article .back{background:none;border:0;color:var(--accent);cursor:pointer;font:500 15px "Public Sans",sans-serif;padding:0}
.sub{margin:40px 0;padding:24px;background:var(--card);border-radius:10px}
.sub h3{font:700 22px "Fraunces",Georgia,serif;margin:0 0 6px}
.sub p{margin:0 0 14px;color:var(--mute);font-size:15px}
.sub div{display:flex;gap:8px;flex-wrap:wrap}
.sub input{flex:1 1 200px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.sub button{padding:10px 18px;border:0;border-radius:6px;background:var(--accent);color:var(--bg);font:600 15px "Public Sans",sans-serif;cursor:pointer}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:14px;padding:24px 0}
</style>
</head>
<body>
<header><div class="wrap">
<button class="brand" id="home">Field Notes</button>
<nav><button id="nav-all" class="on">Posts</button><button id="nav-about">About</button><button id="theme" aria-label="Toggle dark mode">Dark</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">© 2026 Field Notes. Written slowly.</div></footer>
<script>
const POSTS=[
{id:1,t:"Why I started writing every morning",c:"Habits",d:"Oct 8, 2026",m:4,x:"A short daily page changed how I think. Here is what stuck and what I dropped.",b:["For a year I told myself I would write when I had something to say. That day never came. So I picked a smaller promise: one page, before email, every morning.","The first weeks were bad. Most pages were complaints about the weather and my own sleep. But a pattern showed up. When I wrote about a problem for ten minutes, I usually knew the next step by the end.","I dropped the rules that did not help: no word counts, no editing, no sharing. I kept two: same time, same chair. The chair matters more than I expected.","If you want to try it, start with five minutes. Stop when the timer ends, even mid-sentence. You will want to come back tomorrow."]},
{id:2,t:"A beginner's guide to slow travel",c:"Travel",d:"Sep 27, 2026",m:5,x:"Stay longer, see less, remember more. How to plan a trip around one place.",b:["Slow travel means choosing one town and staying for two weeks instead of visiting five cities in ten days.","You learn which bakery opens first, which street floods when it rains, and which neighbor waves back. Those details are the trip.","Rent an apartment, not a hotel. Cook once a day. Leave one afternoon a week with no plan at all.","You will see fewer landmarks. You will come home with stories that are yours."]},
{id:3,t:"Notes on building a small website",c:"Tech",d:"Sep 14, 2026",m:6,x:"You do not need a framework. One HTML file, a bit of CSS, and a clear idea go a long way.",b:["Most personal sites are overbuilt. A single HTML file loads fast, never breaks on update day, and is easy to move.","Start with the content. Write the words first, then pick a typeface that suits them, then add color.","Test on a phone before anything else. If it reads well on a small screen, it will read well everywhere.","Ship it, then improve one thing a week. A live imperfect site beats a perfect one on your laptop."]},
{id:4,t:"What a sourdough starter taught me about patience",c:"Habits",d:"Aug 30, 2026",m:3,x:"Seven days of flour and water, and a lesson in not checking every hour.",b:["My starter did nothing for four days. On day five it doubled overnight and smelled like green apples.","I had been poking it, stirring it, and worrying. The only thing it needed was a warm spot and regular feeding.","Most good things work this way. You set up the conditions, then you wait."]}
];
const app=document.getElementById('app');let cat='All';
const cats=['All',...new Set(POSTS.map(p=>p.c))];
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nav(on){document.getElementById('nav-all').classList.toggle('on',on==='all');document.getElementById('nav-about').classList.toggle('on',on==='about')}
function list(){nav('all');
const items=POSTS.filter(p=>cat==='All'||p.c===cat);
app.innerHTML=`<section class="intro"><h1>Notes on slow, useful things.</h1><p>Short essays about habits, travel, and making small things well. New posts when they are ready.</p>
<div class="tags">${cats.map(c=>`<button class="tag${c===cat?' on':''}" data-c="${c}">${c}</button>`).join('')}</div></section>
${items.map(p=>`<button class="post" data-id="${p.id}"><div class="meta">${p.c} · ${p.d} · ${p.m} min read</div><h2>${esc(p.t)}</h2><p>${esc(p.x)}</p></button>`).join('')}`;
app.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{cat=b.dataset.c;list()});
app.querySelectorAll('.post').forEach(b=>b.onclick=()=>show(+b.dataset.id));window.scrollTo(0,0)}
function show(id){nav('all');const p=POSTS.find(x=>x.id===id);
app.innerHTML=`<article><button class="back">← All posts</button><div class="meta" style="margin-top:20px">${p.c} · ${p.d} · ${p.m} min read</div><h1>${esc(p.t)}</h1>
<div class="body">${p.b.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
<div class="sub"><h3>Get new posts by email</h3><p>One email when a new post goes up. No spam.</p><div><input type="email" id="em" placeholder="you@example.com" aria-label="Email address"><button id="go">Subscribe</button></div><p id="msg" style="margin:10px 0 0" role="status"></p></div></article>`;
app.querySelector('.back').onclick=list;
document.getElementById('go').onclick=()=>{const v=document.getElementById('em').value.trim();document.getElementById('msg').textContent=/^\S+@\S+\.\S+$/.test(v)?'Subscribed. Check your inbox to confirm.':'Enter a valid email address.'};
window.scrollTo(0,0)}
function about(){nav('about');app.innerHTML=`<article><h1>About</h1><div class="body"><p>Field Notes is a small blog about doing fewer things with more care. Posts are short, personal, and written for people who like to think before they act.</p><p>Replace this page with your own story: who you are, what you write about, and how readers can reach you.</p></div></article>`;window.scrollTo(0,0)}
document.getElementById('home').onclick=list;document.getElementById('nav-all').onclick=list;document.getElementById('nav-about').onclick=about;
const tb=document.getElementById('theme');
tb.onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';tb.textContent=dark?'Dark':'Light'};
list();
</script>
</body>
</html>
